<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kiminou Knox — Enter</title>
  <style>
    :root {
      /* Tweak these to move/resize the clickable hand hotspot (percentages of the image). */
      --hotspot-left: 58%;  /* x position from left */
      --hotspot-top: 42%;   /* y position from top */
      --hotspot-width: 20%; /* width of hotspot */
      --hotspot-height: 28%;/* height of hotspot */

      --bg: #0d0d0f;
      --fg: #fff;
      --accent: #ffd400; /* crown yellow */
    }

    html, body { 
      height: 100%; 
      margin: 0; 
      background: var(--bg); 
      color: var(--fg); 
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji"; 
    }
    
    .page { 
      height: 100%; 
      display: grid; 
      place-items: center; 
      overflow: hidden; 
    }

    .splash {
      position: relative;
      width: min(1200px, 92vw);
      aspect-ratio: 16 / 9; /* keep landscape */
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      overflow: hidden;
      background: #111;
      transform: translateY(6px);
      animation: rise .7s cubic-bezier(.2,.9,.2,1) both;
    }

    .splash::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 80% at 20% 20%, rgba(255, 214, 94, 0.18), transparent 55%),
        radial-gradient(100% 70% at 80% 0%, rgba(90, 185, 255, 0.12), transparent 60%),
        linear-gradient(180deg, rgba(8, 10, 14, 0.15), rgba(8, 10, 14, 0.45) 55%, rgba(8, 10, 14, 0.75));
      z-index: 1;
      pointer-events: none;
      animation: glowShift 16s ease-in-out infinite alternate;
    }

    .splash::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(120% 120% at 50% 30%, transparent 55%, rgba(0, 0, 0, 0.65) 100%);
      z-index: 2;
      pointer-events: none;
    }
    
    @keyframes rise { 
      from { 
        opacity: 0; 
        transform: translateY(16px) scale(.985); 
      } 
      to { 
        opacity: 1; 
        transform: translateY(0) scale(1); 
      } 
    }

    .art {
      position: absolute; 
      inset: 0;
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      object-position: center;
      filter: saturate(1.15) contrast(1.05);
      transform-origin: center;
      will-change: transform;
      animation: kenburns 28s ease-in-out infinite alternate;
      user-select: none; 
      -webkit-user-drag: none;
      z-index: 0;
    }

    @keyframes kenburns {
      0% { transform: scale(1) translate3d(0, 0, 0); }
      100% { transform: scale(1.08) translate3d(-2%, -1%, 0); }
    }

    @keyframes glowShift {
      0% { opacity: 0.7; transform: translate3d(0, 0, 0); }
      100% { opacity: 1; transform: translate3d(0, -1.5%, 0); }
    }

    /* Optional animated caption */
    .caption {
      position: absolute; 
      left: 2rem; 
      bottom: 1.25rem;
      font-weight: 700; 
      letter-spacing: .02em;
      text-shadow: 0 2px 12px rgba(0,0,0,.55);
      display: flex; 
      align-items: center; 
      gap: .6rem;
      z-index: 3;
    }
    
    .caption .pulse {
      width: .85rem; 
      height: .85rem; 
      border-radius: 999px; 
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(255,212,0,.7);
      animation: pulse 1.3s infinite;
    }
    
    @keyframes pulse { 
      to { 
        box-shadow: 0 0 0 16px rgba(255,212,0,0); 
      } 
    }

    /* Hotspot that sits over the hand */
    .hotspot {
      position: absolute;
      left: var(--hotspot-left);
      top: var(--hotspot-top);
      width: var(--hotspot-width);
      height: var(--hotspot-height);
      transform: translate(-50%, -50%);
      cursor: pointer;
      border-radius: 50%;
      background: rgba(255,212,0,.12);
      border: 2px solid rgba(255,212,0,.3);
      backdrop-filter: blur(2px);
      transition: all .25s ease;
      animation: glow 2s ease-in-out infinite alternate;
      z-index: 3;
    }
    
    .hotspot:hover {
      background: rgba(255,212,0,.2);
      border-color: rgba(255,212,0,.6);
      transform: translate(-50%, -50%) scale(1.1);
    }
    
    @keyframes glow {
      0% { 
        box-shadow: 0 0 20px rgba(255,212,0,.3); 
      }
      100% { 
        box-shadow: 0 0 40px rgba(255,212,0,.6), 0 0 60px rgba(255,212,0,.3); 
      }
    }

    /* Click ripple effect */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,212,0,.4);
      transform: scale(0);
      animation: ripple .6s linear;
      pointer-events: none;
    }
    
    @keyframes ripple {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    /* Accessibility fallback */
    .enter-btn {
      position: absolute;
      right: 2rem;
      bottom: 1.25rem;
      padding: .75rem 1.5rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s ease;
      text-decoration: none;
      display: inline-block;
      z-index: 3;
    }
    
    .enter-btn:hover {
      background: #ffdf33;
      transform: translateY(-2px);
    }

    /* Fade out animation */
    .fade-out {
      animation: fadeOut .5s ease-in-out forwards;
    }
    
    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: scale(0.95);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .art,
      .splash::before {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="splash" id="splash">
      <img 
        src="/kiminou-hero.png" 
        alt="Kiminou Knox - Click to Enter" 
        class="art"
      />
      
      <!-- Clickable hotspot over the hand -->
      <div class="hotspot" id="hotspot"></div>
      
      <!-- Animated caption -->
      <div class="caption">
        <div class="pulse"></div>
        <span>Click the hand to enter</span>
      </div>
      
      <!-- Accessibility fallback -->
      <a href="/home" class="enter-btn" id="enterBtn">ENTER</a>
    </div>
  </div>

  <script>
    const DESTINATION = '/home'; // Where to go after clicking
    
    const splash = document.getElementById('splash');
    const hotspot = document.getElementById('hotspot');
    const enterBtn = document.getElementById('enterBtn');
    
    function createRipple(event) {
      const splash = event.currentTarget;
      const rect = splash.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      
      const ripple = document.createElement('div');
      ripple.classList.add('ripple');
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      ripple.style.width = '20px';
      ripple.style.height = '20px';
      
      splash.appendChild(ripple);
      
      setTimeout(() => {
        ripple.remove();
      }, 600);
    }
    
    function enterSite() {
      splash.classList.add('fade-out');
      setTimeout(() => {
        window.location.href = DESTINATION;
      }, 500);
    }
    
    // Main interaction
    hotspot.addEventListener('click', (e) => {
      createRipple(e);
      setTimeout(enterSite, 300);
    });
    
    // Fallback button
    enterBtn.addEventListener('click', (e) => {
      e.preventDefault();
      enterSite();
    });
    
    // Keyboard accessibility
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        enterSite();
      }
    });
  </script>
</body>
</html>
