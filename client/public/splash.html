<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kiminou Knox — Enter</title>
  <style>
    :root {
      --hotspot-left: 48%;
      --hotspot-top: 68%;
      --hotspot-width: 18%;
      --hotspot-height: 22%;
      --bg: #0d0d0f;
      --fg: #fff;
      --accent: #ffd400;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }

    .page {
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .splash {
      position: relative;
      width: min(1200px, 92vw);
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      overflow: hidden;
      background: #111;
      transform: translateY(6px);
      animation: rise .7s cubic-bezier(.2,.9,.2,1) both;
    }

    .splash::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 80% at 20% 20%, rgba(255, 214, 94, 0.14), transparent 55%),
        radial-gradient(100% 70% at 80% 0%, rgba(90, 185, 255, 0.1), transparent 60%),
        linear-gradient(180deg, rgba(8, 10, 14, 0.28), rgba(8, 10, 14, 0.58) 55%, rgba(8, 10, 14, 0.86));
      z-index: 1;
      pointer-events: none;
      animation: glowShift 16s ease-in-out infinite alternate;
    }

    .splash::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(120% 120% at 50% 30%, transparent 55%, rgba(0, 0, 0, 0.65) 100%);
      z-index: 2;
      pointer-events: none;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px) scale(.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .art {
      position: absolute;
      inset: 0;
      background-image: url("/click-to-enter-orb-feb-27-2026.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: saturate(1.15) contrast(1.05);
      transform-origin: center;
      will-change: transform;
      animation: heroFloat 30s ease-in-out infinite alternate;
      user-select: none;
      -webkit-user-drag: none;
      z-index: 0;
    }

    @keyframes heroFloat {
      0% { transform: scale(1.02) translate3d(0, 0.5%, 0); }
      50% { transform: scale(1.05) translate3d(-0.5%, -1.2%, 0); }
      100% { transform: scale(1.08) translate3d(-1.4%, -3%, 0); }
    }

    @keyframes glowShift {
      0% { opacity: 0.7; transform: translate3d(0, 0, 0); }
      100% { opacity: 1; transform: translate3d(0, -1.5%, 0); }
    }

    .splash-glow {
      position: absolute;
      inset: -8%;
      background:
        radial-gradient(34% 28% at 70% 58%, rgba(255, 232, 173, 0.18), transparent 22%),
        radial-gradient(28% 26% at 74% 26%, rgba(160, 204, 255, 0.12), transparent 72%),
        radial-gradient(30% 28% at 50% 72%, rgba(255, 255, 255, 0.08), transparent 74%);
      mix-blend-mode: screen;
      opacity: 0.52;
      pointer-events: none;
      z-index: 2;
      will-change: transform, opacity;
      animation: glowPulse 22s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      0% { opacity: 0.42; transform: scale(1) translate3d(0, 0, 0); }
      50% { opacity: 0.62; transform: scale(1.04) translate3d(0, -1%, 0); }
      100% { opacity: 0.5; transform: scale(1.08) translate3d(-1%, -2%, 0); }
    }

    .caption {
      position: absolute;
      left: var(--hotspot-left);
      top: calc(var(--hotspot-top) + 11%);
      transform: translateX(-50%);
      font-weight: 700;
      font-size: .7rem;
      letter-spacing: .26em;
      text-transform: uppercase;
      text-shadow: 0 2px 12px rgba(0,0,0,.55);
      display: flex;
      align-items: center;
      gap: .6rem;
      z-index: 3;
      pointer-events: none;
      white-space: nowrap;
    }

    .caption .pulse {
      width: .85rem;
      height: .85rem;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(255,212,0,.7);
      animation: pulse 1.3s infinite;
    }

    @keyframes pulse {
      to {
        box-shadow: 0 0 0 16px rgba(255,212,0,0);
      }
    }

    .hotspot {
      position: absolute;
      left: var(--hotspot-left);
      top: var(--hotspot-top);
      width: var(--hotspot-width);
      height: var(--hotspot-height);
      transform: translate(-50%, -50%);
      cursor: pointer;
      border-radius: 50%;
      background: transparent;
      border: 2px solid transparent;
      transition: box-shadow .2s ease, transform .2s ease;
      z-index: 3;
      padding: 0;
    }

    .hotspot:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(255,212,0,.65), 0 0 18px rgba(255,212,0,.45);
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,212,0,.4);
      transform: scale(0);
      animation: ripple .6s linear;
      pointer-events: none;
    }

    @keyframes ripple {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    .fade-out {
      animation: fadeOut .5s ease-in-out forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: scale(0.95);
      }
    }

    @media (max-width: 768px) {
      :root {
        --hotspot-left: 45%;
        --hotspot-top: 65%;
        --hotspot-width: 20%;
        --hotspot-height: 24%;
      }

      .caption {
        top: calc(var(--hotspot-top) + 13%);
        font-size: .62rem;
      }

    }

    @media (max-width: 480px) {
      :root {
        --hotspot-left: 44%;
        --hotspot-top: 64%;
        --hotspot-width: 22%;
        --hotspot-height: 26%;
      }

      .caption {
        top: calc(var(--hotspot-top) + 14%);
        letter-spacing: .2em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .art,
      .splash::before,
      .splash-glow {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="splash" id="splash">
      <div class="art" aria-hidden="true"></div>
      <div class="splash-glow"></div>

      <button class="hotspot" id="hotspot" type="button" aria-label="Click the orb to enter">
        <span class="sr-only">Click to Enter</span>
      </button>

      <div class="caption">
        <div class="pulse"></div>
        <span>Click the orb to enter</span>
      </div>

    </div>
  </div>

  <script>
    const DESTINATION = '/home';

    const splash = document.getElementById('splash');
    const hotspot = document.getElementById('hotspot');

    function createRipple(event) {
      const rippleHost = event.currentTarget;
      const rect = rippleHost.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      const ripple = document.createElement('div');
      ripple.classList.add('ripple');
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      ripple.style.width = '20px';
      ripple.style.height = '20px';

      rippleHost.appendChild(ripple);

      setTimeout(() => {
        ripple.remove();
      }, 600);
    }

    function enterSite() {
      window.sessionStorage.setItem('kk-play-intro', '1');
      splash.classList.add('fade-out');
      setTimeout(() => {
        window.location.href = DESTINATION;
      }, 500);
    }

    hotspot.addEventListener('click', (event) => {
      createRipple(event);
      setTimeout(enterSite, 300);
    });

  </script>
</body>
</html>
