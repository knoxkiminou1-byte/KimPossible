kind = "web"
previewPath = "/"
title = "Kiminou"
version = "1.0.0"
id = "artifacts/kiminou"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25499

[services.development]
run = "pnpm --filter @workspace/kiminou run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kiminou", "run", "build" ]
publicDir = "artifacts/kiminou/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25499"
BASE_PATH = "/"
