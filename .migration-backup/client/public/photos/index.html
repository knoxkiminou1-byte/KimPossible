<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photos of Kiminou Knox</title>
  <meta name="description" content="Photos of Kiminou Knox." />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0a;
      --panel: rgba(255,255,255,0.06);
      --panel2: rgba(255,255,255,0.09);
      --border: rgba(255,255,255,0.14);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.70);
      --muted2: rgba(255,255,255,0.55);
      --shadow: 0 14px 40px rgba(0,0,0,0.55);
      --radius: 18px;
      --radius2: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background:
        radial-gradient(900px 500px at 15% -10%, rgba(199,167,108,0.14), transparent 60%),
        radial-gradient(700px 500px at 85% 0%, rgba(139,0,0,0.16), transparent 55%),
        radial-gradient(900px 600px at 50% 110%, rgba(255,255,255,0.08), transparent 60%),
        var(--bg);
      color: var(--text);
    }
    a { color: inherit; text-decoration: none; }
    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 56px 18px 80px;
    }
    header {
      display: grid;
      gap: 10px;
      margin-bottom: 22px;
    }
    .kicker {
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 12px;
      color: var(--muted2);
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 44px);
      line-height: 1.1;
    }
    .sub {
      margin: 0;
      max-width: 70ch;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      margin-top: 22px;
    }
    .card {
      background: linear-gradient(180deg, var(--panel), rgba(255,255,255,0.03));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 0 0 rgba(0,0,0,0);
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.22);
      box-shadow: var(--shadow);
    }
    .thumb {
      width: 100%;
      padding: 0;
      margin: 0;
      border: 0;
      display: block;
      background: transparent;
      cursor: zoom-in;
    }
    .thumb img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
      background: rgba(255,255,255,0.03);
    }
    figcaption {
      padding: 12px 14px 14px;
      display: grid;
      gap: 4px;
    }
    .date {
      font-size: 12px;
      color: var(--muted2);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .context {
      font-size: 14px;
      color: var(--text);
      line-height: 1.35;
    }
    .footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,0.10);
      color: var(--muted2);
      font-size: 12px;
    }
    dialog {
      width: min(1100px, calc(100vw - 24px));
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(10,10,10,0.84);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 0;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    dialog::backdrop {
      background: rgba(0,0,0,0.72);
    }
    .modal {
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .modalTop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
    }
    .modalTitle {
      font-size: 13px;
      color: var(--muted);
    }
    .close {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border-radius: 12px;
      padding: 8px 10px;
      cursor: pointer;
    }
    .close:hover {
      background: rgba(255,255,255,0.10);
    }
    .modalBody {
      padding: 0;
      margin: 0;
      background: rgba(0,0,0,0.35);
    }
    .modalBody img {
      width: 100%;
      height: auto;
      display: block;
      background: rgba(255,255,255,0.02);
    }
    .modalBottom {
      padding: 12px 14px 14px;
      border-top: 1px solid rgba(255,255,255,0.12);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }
    .pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="kicker">Gallery</div>
      <h1>Photos of Kiminou Knox</h1>
      <p class="sub">A small public gallery. Each photo includes the date it was uploaded and a short context note.</p>
      <div><span class="pill">Updated Jan 26, 2026</span></div>
    </header>

    <section class="grid" aria-label="Photo gallery">
      <figure class="card">
        <button class="thumb" type="button" data-src="/photos/kiminou-knox-01-cafe-portrait.jpg" data-alt="Kiminou Knox photo — Candid portrait at a café. (Jan 26, 2026)" data-caption="Jan 26, 2026 · Candid portrait at a café.">
          <img src="/photos/kiminou-knox-01-cafe-portrait.jpg" alt="Kiminou Knox photo — Candid portrait at a café. (Jan 26, 2026)" loading="lazy" decoding="async" />
        </button>
        <figcaption>
          <div class="date">Jan 26, 2026</div>
          <div class="context">Candid portrait at a café.</div>
        </figcaption>
      </figure><figure class="card">
        <button class="thumb" type="button" data-src="/photos/kiminou-knox-02-basketball-game-action.jpg" data-alt="Kiminou Knox photo — In-game basketball action shot. (Jan 26, 2026)" data-caption="Jan 26, 2026 · In-game basketball action shot.">
          <img src="/photos/kiminou-knox-02-basketball-game-action.jpg" alt="Kiminou Knox photo — In-game basketball action shot. (Jan 26, 2026)" loading="lazy" decoding="async" />
        </button>
        <figcaption>
          <div class="date">Jan 26, 2026</div>
          <div class="context">In-game basketball action shot.</div>
        </figcaption>
      </figure><figure class="card">
        <button class="thumb" type="button" data-src="/photos/kiminou-knox-03-studio-portrait-sunglasses.jpg" data-alt="Kiminou Knox photo — Studio portrait with sunglasses. (Jan 26, 2026)" data-caption="Jan 26, 2026 · Studio portrait with sunglasses.">
          <img src="/photos/kiminou-knox-03-studio-portrait-sunglasses.jpg" alt="Kiminou Knox photo — Studio portrait with sunglasses. (Jan 26, 2026)" loading="lazy" decoding="async" />
        </button>
        <figcaption>
          <div class="date">Jan 26, 2026</div>
          <div class="context">Studio portrait with sunglasses.</div>
        </figcaption>
      </figure><figure class="card">
        <button class="thumb" type="button" data-src="/photos/kiminou-knox-04-indoor-selfie-portrait.jpg" data-alt="Kiminou Knox photo — Indoor portrait selfie. (Jan 26, 2026)" data-caption="Jan 26, 2026 · Indoor portrait selfie.">
          <img src="/photos/kiminou-knox-04-indoor-selfie-portrait.jpg" alt="Kiminou Knox photo — Indoor portrait selfie. (Jan 26, 2026)" loading="lazy" decoding="async" />
        </button>
        <figcaption>
          <div class="date">Jan 26, 2026</div>
          <div class="context">Indoor portrait selfie.</div>
        </figcaption>
      </figure><figure class="card">
        <button class="thumb" type="button" data-src="/photos/kiminou-knox-05-outdoor-portrait-documents.jpg" data-alt="Kiminou Knox photo — Outdoor portrait holding documents. (Jan 26, 2026)" data-caption="Jan 26, 2026 · Outdoor portrait holding documents.">
          <img src="/photos/kiminou-knox-05-outdoor-portrait-documents.jpg" alt="Kiminou Knox photo — Outdoor portrait holding documents. (Jan 26, 2026)" loading="lazy" decoding="async" />
        </button>
        <figcaption>
          <div class="date">Jan 26, 2026</div>
          <div class="context">Outdoor portrait holding documents.</div>
        </figcaption>
      </figure><figure class="card">
        <button class="thumb" type="button" data-src="/photos/kiminou-knox-06-football-uniform.jpg" data-alt="Kiminou Knox photo — Football uniform portrait. (Jan 26, 2026)" data-caption="Jan 26, 2026 · Football uniform portrait.">
          <img src="/photos/kiminou-knox-06-football-uniform.jpg" alt="Kiminou Knox photo — Football uniform portrait. (Jan 26, 2026)" loading="lazy" decoding="async" />
        </button>
        <figcaption>
          <div class="date">Jan 26, 2026</div>
          <div class="context">Football uniform portrait.</div>
        </figcaption>
      </figure><figure class="card">
        <button class="thumb" type="button" data-src="/photos/kiminou-knox-07-basketball-media-portrait.jpg" data-alt="Kiminou Knox photo — Basketball portrait with ball. (Jan 26, 2026)" data-caption="Jan 26, 2026 · Basketball portrait with ball.">
          <img src="/photos/kiminou-knox-07-basketball-media-portrait.jpg" alt="Kiminou Knox photo — Basketball portrait with ball. (Jan 26, 2026)" loading="lazy" decoding="async" />
        </button>
        <figcaption>
          <div class="date">Jan 26, 2026</div>
          <div class="context">Basketball portrait with ball.</div>
        </figcaption>
      </figure><figure class="card">
        <button class="thumb" type="button" data-src="/photos/kiminou-knox-08-outdoor-candid.jpg" data-alt="Kiminou Knox photo — Outdoor candid portrait. (Jan 26, 2026)" data-caption="Jan 26, 2026 · Outdoor candid portrait.">
          <img src="/photos/kiminou-knox-08-outdoor-candid.jpg" alt="Kiminou Knox photo — Outdoor candid portrait. (Jan 26, 2026)" loading="lazy" decoding="async" />
        </button>
        <figcaption>
          <div class="date">Jan 26, 2026</div>
          <div class="context">Outdoor candid portrait.</div>
        </figcaption>
      </figure>
    </section>

    <div class="footer">
      Tip: click a photo to view it larger.
    </div>
  </main>

  <dialog id="lightbox" aria-label="Photo viewer">
    <div class="modal">
      <div class="modalTop">
        <div class="modalTitle" id="lbTitle">Photo</div>
        <button class="close" type="button" id="lbClose" aria-label="Close">Close</button>
      </div>
      <div class="modalBody">
        <img id="lbImg" src="" alt="" />
      </div>
      <div class="modalBottom" id="lbCaption"></div>
    </div>
  </dialog>

  <script>
    (function() {
      const dlg = document.getElementById("lightbox");
      const img = document.getElementById("lbImg");
      const cap = document.getElementById("lbCaption");
      const title = document.getElementById("lbTitle");
      const close = document.getElementById("lbClose");

      function openLightbox(src, alt, caption) {
        img.src = src;
        img.alt = alt || "Photo";
        cap.textContent = caption || "";
        title.textContent = "Photo";
        if (typeof dlg.showModal === "function") dlg.showModal();
      }

      document.querySelectorAll("[data-src]").forEach((btn) => {
        btn.addEventListener("click", () => {
          openLightbox(btn.dataset.src, btn.dataset.alt, btn.dataset.caption);
        });
      });

      close.addEventListener("click", () => dlg.close());
      dlg.addEventListener("click", (e) => {
        const rect = dlg.getBoundingClientRect();
        const inside = rect.top <= e.clientY && e.clientY <= rect.bottom && rect.left <= e.clientX && e.clientX <= rect.right;
        if (!inside) dlg.close();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && dlg.open) dlg.close();
      });
    })();
  </script>
</body>
</html>
